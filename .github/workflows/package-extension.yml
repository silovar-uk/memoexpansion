name: Package extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        run: python -m json.tool manifest.json > /dev/null

      - name: Validate JavaScript syntax
        run: |
          node --check background.js
          node --check outliner-structure.js
          node --check save-state.js
          node --check tab-navigation-core.js
          node --check sidepanel.js
          node --check sidepanel-tabs.js
          node --check sidepanel-render.js
          node --check sidepanel-selection.js
          node --check sidepanel-input.js
          node --check sidepanel-meta.js
          node --check sidepanel-ui.js
          node --check sidepanel-model.js
          node --check sidepanel-runtime.js
          node --check sidepanel-focus.js
          node --check sidepanel-accessibility.js
          node --check sidepanel-shell.js
          node --check sidepanel-navigation.js
          node --check tests/ui-shell-contract.test.js
          node --check tests/save-state.test.js
          node --check tests/save-contract.test.js
          node --check tests/tab-navigation.test.js
          node --check tests/navigation-contract.test.js
          node --check tests/outliner-structure.test.js

      - name: Run structure characterization tests
        run: node tests/outliner-structure.test.js

      - name: Run quiet shell contract test
        run: node tests/ui-shell-contract.test.js

      - name: Run save confidence tests
        run: |
          node tests/save-state.test.js
          node tests/save-contract.test.js

      - name: Run navigation confidence tests
        run: |
          node tests/tab-navigation.test.js
          node tests/navigation-contract.test.js

      - name: Validate removed menus and cleanup
        run: |
          ! grep -RE "menu-toggle|action-buttons|footer-menu|btn-footer-menu|btn-force-reload|btn-copy-clipboard|btn-download-(txt|md)|showMoveTabMenu|showColorPalette|moveItemToTop|moveItemToBottom|moveItemToTab|copyItem\\(|action-menu-pinned|sidepanel-enter-fix|sidepanel-bootstrap|sidepanel-ui-cleanup" --include='*.js' --include='*.html' --include='*.css' .
          ! grep -RE "transition: all" --include='*.css' --include='*.html' .
          ! grep -RE "innerHTML.*tab\\.title" --include='*.js' .

      - name: Build extension ZIP
        run: |
          zip -r memoexpansion-extension.zip \
            manifest.json \
            background.js \
            outliner-structure.js \
            save-state.js \
            tab-navigation-core.js \
            sidepanel.html \
            sidepanel.js \
            sidepanel-tabs.js \
            sidepanel-render.js \
            sidepanel-selection.js \
            sidepanel-input.js \
            sidepanel-meta.js \
            sidepanel-ui.js \
            sidepanel-model.js \
            sidepanel-runtime.js \
            sidepanel-focus.js \
            sidepanel-accessibility.js \
            sidepanel-shell.css \
            sidepanel-shell.js \
            sidepanel-navigation.css \
            sidepanel-navigation.js \
            sidepanel-base.css \
            sidepanel-tabs.css \
            sidepanel-editor.css \
            sidepanel-components.css \
            sidepanel-maintenance.css \
            README_UPDATE.md \
            icons

      - name: Verify ZIP root and version
        run: |
          unzip -t memoexpansion-extension.zip
          unzip -Z1 memoexpansion-extension.zip | grep -qx 'manifest.json'
          test "$(unzip -p memoexpansion-extension.zip manifest.json | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "2.4.0"

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: memoexpansion-extension-v2.4.0
          path: memoexpansion-extension.zip
          if-no-files-found: error
          retention-days: 30
