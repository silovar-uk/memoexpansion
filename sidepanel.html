<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="sidepanel-base.css">
<link rel="stylesheet" href="sidepanel-tabs.css">
<link rel="stylesheet" href="sidepanel-editor.css">
<link rel="stylesheet" href="sidepanel-components.css">
<link rel="stylesheet" href="sidepanel-recovery.css">
<link rel="stylesheet" href="sidepanel-maintenance.css">
<link rel="stylesheet" href="sidepanel-shell.css">
<link rel="stylesheet" href="sidepanel-navigation.css">
</head>
<body>


<div id="tab-header-area">
  <button id="tab-scroll-left" class="tab-scroll-btn" title="左へスクロール" aria-label="左へスクロール">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <div id="tab-list" role="tablist" aria-label="メモタブ"></div>
  <button id="tab-scroll-right" class="tab-scroll-btn" title="右へスクロール" aria-label="右へスクロール">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
  </button>

  <div class="tab-utility-group" aria-label="メモ操作">
    <span id="instance-count" class="instance-indicator" hidden aria-live="polite"></span>
    <button id="btn-tab-search" class="control-btn" type="button" title="メモを探す (Alt+Q)" aria-label="メモを探す" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
    </button>
    <button id="btn-line-numbers" class="control-btn" title="行番号を非表示（アウトライナーのみ）" aria-label="行番号の表示切替" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 5h1v3M4 11h2l-2 3h2M4 17h2v3H4"/></svg>
    </button>
    <button id="btn-sort-stars" class="control-btn" title="★の数で降順ソート" aria-label="★の数で降順ソート">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 8.2l5-.7L12 3Z"/><path d="M19 14v7m0 0-3-3m3 3 3-3"/></svg>
    </button>

    <div class="new-tab-wrapper">
      <button id="new-tab-btn" title="新規メモ作成" aria-label="新規メモ作成">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div id="new-tab-menu" class="mode-menu">
        <div class="mode-menu-item" id="menu-outliner">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
          <span>アウトライナー</span>
        </div>
        <div class="mode-menu-item" id="menu-text">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>テキスト</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="tab-switcher" class="tab-switcher" hidden>
  <div class="tab-switcher-panel" role="dialog" aria-label="メモを探す">
    <input id="tab-switcher-input" type="search" autocomplete="off" spellcheck="false" placeholder="メモ名で検索..." aria-label="メモ名で検索">
    <div id="tab-switcher-list" role="listbox" aria-label="メモ候補"></div>
    <div class="tab-switcher-hint">↑↓ 選択 · Enter 開く · Esc 閉じる</div>
  </div>
</div>

<div id="editor-container">
  <div id="editor"></div>
</div>

<div id="selection-bar" class="hidden">
  <div class="selection-summary">
    <span id="selection-count">0件選択</span>
  </div>
  <div class="btn-group">
    <button id="btn-selection-cancel" class="btn-secondary">解除</button>
    <button id="btn-selection-move" class="btn-primary">移動</button>
  </div>
</div>

<footer>
  <div class="footer-left undo-redo">
    <button id="btn-undo" class="footer-icon-btn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M20 17a7 7 0 0 0-7-7H4"/></svg>
    </button>
    <button id="btn-redo" class="footer-icon-btn" title="やり直す (Ctrl+Shift+Z)" aria-label="やり直す">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M4 17a7 7 0 0 1 7-7h9"/></svg>
    </button>
  </div>

  <div class="footer-right">
    <div id="save-status" class="save-status" data-state="saved" role="status" aria-live="polite" aria-atomic="true">
      <span class="save-status-dot" aria-hidden="true"></span>
      <span id="save-status-text">保存済み</span>
    </div>
    <button id="btn-copy-all" class="copy-all-btn" type="button" title="全体をコピー" aria-label="メモ全体をコピー">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M15 9V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/></svg>
    </button>
  </div>
</footer>

<script src="outliner-structure.js"></script>
<script src="recovery-state.js"></script>
<script src="sidepanel.js"></script>
<script src="sidepanel-tabs.js"></script>
<script src="sidepanel-render.js"></script>
<script src="sidepanel-selection.js"></script>
<script src="sidepanel-input.js"></script>
<script src="sidepanel-meta.js"></script>
<script src="sidepanel-ui.js"></script>
<script src="sidepanel-model.js"></script>
<script src="sidepanel-recovery.js"></script>
<script src="save-state.js"></script>
<script src="sidepanel-runtime.js"></script>
<script src="sidepanel-focus.js"></script>
<script src="sidepanel-accessibility.js"></script>
<script src="sidepanel-shell.js"></script>
<script src="tab-navigation-core.js"></script>
<script src="sidepanel-navigation.js"></script>
</body>
</html>
