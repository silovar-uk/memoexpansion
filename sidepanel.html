<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  /* --- ベーススタイル --- */
  :root {
    --bg-color: #fafaf9;
    --text-color: #44403c;
    --border-color: #e7e5e4;
    --accent-color: #fb923c;
    --tab-active-bg: #ffffff;
    --tab-inactive-bg: #f5f5f4;
    --hover-bg: #f5f5f4;
    --selected-bg: #e0f2fe; /* 選択時の背景色 */
  }

  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  /* --- ヘッダー & ステータス --- */
  header {
    background: white;
    padding: 4px 12px;
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
    z-index: 50;
  }

  #status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 32px;
    transition: background-color 0.5s ease;
  }

  /* 複数インスタンス起動時の黄色点滅アラート */
  @keyframes instance-flash {
    0% { background-color: #fef9c3; }
    50% { background-color: #fde047; }
    100% { background-color: #fef9c3; }
  }
  .instance-alert { 
    animation: instance-flash 1.2s infinite ease-in-out; 
    border-radius: 4px; 
    padding: 2px; 
  }
  .instance-alert .status-pill { color: #854d0e; background: #fef3c7; }

  .status-left, .status-right { display: flex; align-items: center; gap: 4px; }
  .status-title { font-weight: bold; font-size: 12px; color: #57534e; margin-right: 4px; }
  .status-pill { font-size: 11px; color: #78716c; background: #f5f5f4; padding: 2px 6px; border-radius: 4px; }

  button {
    background: none; border: 1px solid transparent; cursor: pointer;
    padding: 2px 6px; border-radius: 4px; color: #78716c; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  button:hover { background-color: var(--hover-bg); }
  
  .mode-switch { display: flex; background: #e0f2fe; border-radius: 4px; padding: 2px; gap: 1px; }
  .mode-btn { border: none; padding: 2px 6px; font-size: 10px; color: #0369a1; border-radius: 3px; }
  .mode-btn.active { background: white; font-weight: bold; shadow: 0 1px 2px rgba(0,0,0,0.1); }
  
  .control-btn { border: 1px solid #cbd5e1; background: white; width: 24px; height: 24px; padding: 0; }
  .mini-btn { border: 1px solid #bfdbfe; background: white; border-radius: 10px; font-size: 9px; padding: 0 6px; color: #0284c7; height: 18px; }

  /* --- タブバー構造 (Layout Fix) --- */
  #tab-header-area {
    background: #e7e5e4;
    padding: 4px 4px 0 4px;
    display: flex;
    gap: 2px;
    flex-shrink: 0;
    align-items: flex-end; /* 下揃え */
  }

  /* スクロールボタン */
  .tab-scroll-btn {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1px solid #d6d3d1;
    background: white;
    color: #78716c;
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    margin-bottom: 2px; /* タブの下端に合わせる微調整 */
    flex-shrink: 0;
  }
  .tab-scroll-btn:hover { background: #f5f5f4; color: #44403c; border-color: #a8a29e; }
  .tab-scroll-btn:active { background: #e7e5e4; }

  /* タブのスクロール領域 */
  #tab-list {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    flex: 1; /* 余った幅を使う */
    scrollbar-width: none; 
    -ms-overflow-style: none;
    align-items: flex-end;
    /* ドラッグ用カーソル（通常はgrab） */
    cursor: default; 
    /* ドラッグ中のテキスト選択防止 */
    user-select: none; 
    padding-bottom: 0px;
  }
  #tab-list::-webkit-scrollbar { display: none; }
  
  /* 余白のドラッグスクロール中 */
  #tab-list.grabbing {
    cursor: grabbing;
  }

  .tab {
    background: var(--tab-inactive-bg);
    padding: 6px 8px 6px 12px;
    border-radius: 6px 6px 0 0;
    font-size: 12px;
    color: #78716c;
    cursor: pointer;
    border: 1px solid transparent;
    border-bottom: none;
    user-select: none;
    position: relative;
    display: flex;
    align-items: center;
    gap: 4px;
    max-width: 140px;
    height: 18px; /* 高さ固定 */
    flex-shrink: 0; /* 潰れないように */
    transition: transform 0.2s, background-color 0.2s;
  }
  .tab.active {
    background: var(--tab-active-bg);
    color: #44403c;
    font-weight: bold;
    box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
    height: 20px; /* アクティブは少し高く */
    margin-top: -2px;
    z-index: 10;
  }
  .tab:hover:not(.active) { background: #f0f0ed; }

  /* ドラッグ&ドロップ中のスタイル */
  .tab.dragging {
    opacity: 0.5;
    background: #e2e8f0;
    border: 1px dashed #94a3b8;
  }
  /* ドロップ対象のスタイル */
  .tab.drag-over {
    /* 左側に挿入ラインを表示 */
    border-left: 3px solid #0ea5e9;
    padding-left: 9px; /* border分調整 */
  }
  
  .tab-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none; /* ドラッグ操作を阻害しないように */
  }
  
  .tab input {
    background: white; border: 1px solid #0ea5e9; border-radius: 2px;
    font-size: 12px; padding: 2px; margin: -3px; width: 100%;
  }

  .close-tab-btn {
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    font-size: 10px; color: #a8a29e;
    opacity: 0.6;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .close-tab-btn:hover { background-color: #fee2e2; color: #ef4444; opacity: 1; }

  /* 新規タブボタン周辺 */
  .new-tab-wrapper {
    position: relative;
    flex-shrink: 0;
    padding-bottom: 6px; /* タブのベースラインに合わせる */
    z-index: 60; /* メニューがタブの上に表示されるように */
    margin-left: 2px;
  }

  #new-tab-btn {
    padding: 2px 8px;
    font-size: 14px;
    color: #57534e;
    cursor: pointer;
    font-weight: bold;
    display: flex; align-items: center;
    height: 18px;
    border-radius: 4px;
  }
  #new-tab-btn:hover { color: #0ea5e9; background: rgba(255,255,255,0.5); }

  /* モード選択メニュー */
  .mode-menu {
    position: absolute;
    top: 24px; right: 0; /* ボタンの直下に右寄せ */
    background: white;
    border: 1px solid #e7e5e4;
    border-radius: 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    display: none; /* JSで制御 */
    flex-direction: column;
    z-index: 100;
    min-width: 130px;
    padding: 4px;
  }
  .mode-menu-item {
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 2px;
    display: flex; align-items: center; gap: 8px;
    color: #44403c;
  }
  .mode-menu-item:hover { background-color: #f0f9ff; color: #0284c7; }

  /* --- エディタエリア --- */
  #editor-container {
    flex: 1;
    background: white;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  #editor {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 80px;
  }

  /* テキストモード用エディタ */
  .text-editor-area {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    resize: none;
    font-size: 14px;
    line-height: 1.6;
    font-family: inherit;
    color: inherit;
    background: transparent;
  }

  /* --- アウトライナー用スタイル --- */
  .row {
    display: flex; align-items: flex-start; position: relative;
    padding: 2px 0; min-height: 28px;
    border-radius: 4px;
    transition: opacity 0.3s ease, height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
  }
  .row-fade-out {
    opacity: 0 !important;
    height: 0 !important;
    min-height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
    overflow: hidden;
  }
  
  /* 複数選択時のスタイル */
  .row.selected {
    background-color: var(--selected-bg);
  }
  .row.selected .item-input {
    background-color: var(--selected-bg); /* 入力欄も背景色を合わせる */
  }

  .guide-line {
    position: absolute; top: 0; bottom: 0; left: 0; width: 1px;
    background-color: #e7e5e4; opacity: 0; pointer-events: none;
  }
  .row:hover .guide-line { opacity: 1; }
  
  /* --- 折り畳みアイコン兼バレット --- */
  .fold-icon {
    width: 20px; height: 20px; /* タップしやすいサイズ */
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; 
    color: #a8a29e; /* 通常（展開中）はグレー */
    cursor: pointer; user-select: none;
    margin-top: 4px; /* テキストの行高に合わせて調整 */
    margin-right: 2px; flex-shrink: 0;
    transition: color 0.2s, background-color 0.2s;
    border-radius: 4px;
  }
  .fold-icon:hover { color: #57534e; background-color: #f5f5f4; }
  
  /* 閉じているとき（青色強調） */
  .fold-icon.collapsed { color: #3b82f6; }
  .fold-icon.collapsed:hover { color: #2563eb; background-color: #eff6ff; }

  /* 子がない場合（リーフ） */
  .fold-icon.leaf { 
    color: #d6d3d1; 
    font-size: 14px; /* ドットを見やすく */
    line-height: 1;
  }
  /* リーフでもホバー時に少し濃くしてインタラクティブ感を出す（選択できるため） */
  .fold-icon.leaf:hover { color: #a8a29e; background-color: #fafaf9; }

  .input-wrapper { 
    flex: 1; min-width: 0; position: relative;
    padding-right: 50px; /* 通常時は完了・メニューボタン分だけ確保。日時は必要時のみ重ねて表示 */
    box-sizing: border-box;
  }

  .item-input {
    width: 100%; background: transparent; border: none; outline: none;
    font-size: 14px; line-height: 24px; color: inherit; font-family: inherit;
    resize: none; padding: 0; margin: 0; min-height: 24px; height: 24px;
    overflow-x: hidden; overflow-y: hidden; display: block;
    white-space: pre; word-break: normal; box-sizing: border-box;
    border-radius: 2px;
  }
  .item-input:focus {
    font-size: 14px !important;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .item-input:focus::-webkit-scrollbar { display: none; }
  .item-input::placeholder { color: #d6d3d1; }

  /* 詳細(Note)用のスタイル */
  .item-note {
    width: 100%; background: transparent; border: none; outline: none;
    font-size: 12px; line-height: 1.4; color: #78716c; font-family: inherit;
    resize: none; padding: 0; margin-top: 2px; display: block; height: auto;
    overflow: hidden;
  }
  .item-note.hidden { display: none; }
  
  /* リンクボタンコンテナ */
  .note-link-container {
    display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px;
    padding-left: 2px;
  }
  /* リンクボタン */
  .note-link-btn {
    display: flex; align-items: center; gap: 2px;
    font-size: 10px; color: #0284c7; background: #e0f2fe;
    padding: 2px 6px; border-radius: 10px; text-decoration: none;
    cursor: pointer; border: 1px solid #bae6fd;
    user-select: none;
  }
  .note-link-btn:hover {
    background: #bae6fd;
  }

  /* 装飾 */
  .text-red { color: #ef4444; }
  .text-blue { color: #3b82f6; }
  .text-green { color: #22c55e; }
  .text-bold-red { color: #ef4444; font-weight: bold; }

  .bg-yellow { background-color: #fef08a; }
  .bg-pink { background-color: #fbcfe8; }
  .bg-blue { background-color: #bae6fd; }

  /* --- 行アクション (折り畳みメニュー対応) --- */
  .row-actions {
    position: absolute; right: 0; top: 2px;
    display: flex; gap: 2px;
    align-items: center;
    background: rgba(255,255,255,0.72);
    padding: 1px 2px; border-radius: 4px;
    opacity: 0.72; pointer-events: auto;
    transition: opacity 0.1s, background-color 0.1s; z-index: 10;
  }
  .row:hover .row-actions,
  .row:focus-within .row-actions {
    opacity: 1;
    background: rgba(255,255,255,0.97);
  }

  .action-buttons {
    display: none; /* デフォルトは隠す */
    gap: 2px;
  }

  .created-at-label {
    width: 0;
    max-width: 0;
    margin: 0;
    overflow: hidden;
    white-space: nowrap;
    font-size: 10px;
    line-height: 1;
    color: #a8a29e;
    opacity: 0;
    transform: translateX(4px);
    transition: opacity .12s ease, transform .12s ease, width .12s ease, max-width .12s ease, margin .12s ease;
    user-select: none;
    pointer-events: none;
  }
  .row:hover .created-at-label,
  .row:focus-within .created-at-label {
    width: auto;
    max-width: 78px;
    margin-left: 2px;
    opacity: .92;
    transform: translateX(0);
    pointer-events: auto;
    cursor: help;
  }

  /* ピン留め状態のときは常に展開 */
  body.action-menu-pinned .action-buttons { display: flex; }

  .action-icon {
    width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #a8a29e; border-radius: 3px; font-size: 12px;
  }
  .action-icon:hover { background-color: #f5f5f4; color: #57534e; }
  .action-icon.check:hover { color: #22c55e; background-color: #dcfce7; }
  .action-icon.palette:hover { color: #e11d48; background-color: #ffe4e6; }
  .action-icon.move:hover { color: #0284c7; background-color: #e0f2fe; }
  .action-icon.top:hover { color: #8b5cf6; background-color: #f3e8ff; }
  .action-icon.bottom:hover { color: #f97316; background-color: #ffedd5; }
  
  .menu-toggle { font-weight: bold; }
  body.action-menu-pinned .menu-toggle { background-color: #e0f2fe; color: #0284c7; }

  /* カラーパレット & コンテキストメニュー共通 */
  .popup-menu {
    position: absolute; 
    background: white; border: 1px solid #e7e5e4; border-radius: 4px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 4px;
    display: flex; flex-direction: column; gap: 2px;
    z-index: 100; min-width: 120px;
  }
  .popup-menu-item {
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 2px;
    color: #44403c;
    display: flex; align-items: center; gap: 8px;
  }
  .popup-menu-item:hover { background-color: #f0f9ff; color: #0284c7; }
  .popup-menu-header {
    font-size: 10px; color: #a8a29e; padding: 4px 8px; border-bottom: 1px solid #f5f5f4; margin-bottom: 2px;
  }

  .palette-row { display: flex; gap: 4px; justify-content: space-between; align-items: center;}
  .palette-label { font-size: 10px; color: #a8a29e; }
  .color-swatch { width: 16px; height: 16px; border-radius: 3px; cursor: pointer; border: 1px solid #e5e5e5; }
  .color-swatch:hover { transform: scale(1.1); }

  /* --- 選択操作バー --- */
  #selection-bar {
    background: #f0f9ff;
    border-top: 1px solid #bae6fd;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: #0369a1;
  }

  /* フッター */
  footer {
    background: #fafaf9; border-top: 1px solid #e7e5e4;
    padding: 8px 16px; display: flex;
    justify-content: space-between; align-items: center; gap: 8px;
  }

  .btn-group { display: flex; gap: 4px; }
  .btn-primary {
    background: #0ea5e9; color: white; border: none;
    padding: 6px 12px; font-weight: bold; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-primary:hover { background: #0284c7; }
  .btn-secondary { 
    background: white; border: 1px solid #cbd5e1; color: #475569; padding: 6px 10px; 
    border-radius: 4px; cursor: pointer;
  }
  .btn-secondary:hover { background: #f1f5f9; }
  .undo-redo { display: flex; gap: 2px; }
  .hidden { display: none !important; }

  /* --- テーマカラー (背景とタブ) --- */
  .editor-bg-red { background-color: #fef2f2 !important; }
  .editor-bg-blue { background-color: #f0f9ff !important; }
  .editor-bg-green { background-color: #f0fdf4 !important; }
  .editor-bg-yellow { background-color: #fefce8 !important; }
  .editor-bg-purple { background-color: #faf5ff !important; }

  .tab.tab-bg-red { background-color: #fee2e2; }
  .tab.tab-bg-red.active { background-color: #fef2f2; }
  .tab.tab-bg-blue { background-color: #e0f2fe; }
  .tab.tab-bg-blue.active { background-color: #f0f9ff; }
  .tab.tab-bg-green { background-color: #dcfce7; }
  .tab.tab-bg-green.active { background-color: #f0fdf4; }
  .tab.tab-bg-yellow { background-color: #fef9c3; }
  .tab.tab-bg-yellow.active { background-color: #fefce8; }
  .tab.tab-bg-purple { background-color: #f3e8ff; }
  .tab.tab-bg-purple.active { background-color: #faf5ff; }


  /* --- Visual refresh 2.0.2: icons / color system / footer --- */
  :root {
    --bg-color: #f7f7f5;
    --text-color: #27272a;
    --text-muted: #71717a;
    --text-faint: #a1a1aa;
    --border-color: #e4e4e7;
    --border-strong: #d4d4d8;
    --surface: #ffffff;
    --surface-subtle: #f4f4f5;
    --surface-hover: #f0f0f2;
    --accent-color: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --success-color: #16a34a;
    --warning-color: #ca8a04;
    --danger-color: #dc2626;
    --tab-active-bg: #ffffff;
    --tab-inactive-bg: #f4f4f5;
    --hover-bg: #f0f0f2;
    --selected-bg: #eff6ff;
  }

  body { background: var(--bg-color); color: var(--text-color); }
  header, #editor-container { background: var(--surface); }
  header, footer { border-color: var(--border-color); }

  button, .action-icon, .fold-icon, .tab-scroll-btn, #new-tab-btn {
    color: var(--text-muted);
  }
  button svg, .action-icon svg, .fold-icon svg, .mode-menu-item svg,
  .note-link-btn svg, .tab-scroll-btn svg, #new-tab-btn svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
    pointer-events: none;
  }
  .mode-menu-item svg { width: 16px; height: 16px; }
  .control-btn svg { width: 16px; height: 16px; }
  .control-btn svg circle, .footer-icon-btn svg circle,
  .action-icon.menu-toggle svg circle, .action-icon.palette svg circle,
  .fold-icon.leaf svg circle { fill: currentColor; stroke: none; }

  button:hover, .action-icon:hover, .fold-icon:hover {
    background: var(--surface-hover);
    color: var(--text-color);
  }
  .status-title { color: var(--text-color); }
  .status-pill { color: var(--text-muted); background: var(--surface-subtle); }
  .control-btn, .mini-btn, .tab-scroll-btn {
    border-color: var(--border-color);
    background: var(--surface);
  }
  .control-btn:hover, .tab-scroll-btn:hover {
    border-color: var(--border-strong);
    background: var(--surface-hover);
    color: var(--text-color);
  }
  .mode-switch { background: var(--surface-subtle); }
  .mode-btn { color: var(--text-muted); }
  .mode-btn.active { color: var(--accent-color); background: var(--surface); }

  #tab-header-area { background: #ececea; }
  .tab { color: var(--text-muted); }
  .tab.active { color: var(--text-color); }
  .tab.drag-over { border-left-color: var(--accent-color); }
  .close-tab-btn:hover { background: #fef2f2; color: var(--danger-color); }
  #new-tab-btn {
    width: 26px;
    padding: 0;
    border: 0;
    background: transparent;
  }
  #new-tab-btn:hover { color: var(--accent-color); background: rgba(255,255,255,.7); }
  .mode-menu, .popup-menu { border-color: var(--border-color); }
  .mode-menu-item, .popup-menu-item { color: var(--text-color); }
  .mode-menu-item:hover, .popup-menu-item:hover {
    color: var(--accent-color);
    background: var(--accent-soft);
  }

  .row.selected, .row.selected .item-input { background: var(--selected-bg); }
  .guide-line { background: var(--border-color); }
  .fold-icon { color: var(--text-faint); }
  .fold-icon.collapsed { color: var(--accent-color); }
  .fold-icon.collapsed:hover { color: var(--accent-hover); background: var(--accent-soft); }
  .fold-icon.leaf { color: var(--border-strong); }
  .item-note { color: var(--text-muted); }
  .note-link-btn {
    color: var(--accent-color);
    background: var(--accent-soft);
    border-color: #dbeafe;
  }
  .note-link-btn:hover { background: #dbeafe; }

  .row-actions { color: var(--text-muted); }
  .action-icon { color: var(--text-faint); }
  .action-icon:hover,
  .action-icon.check:hover,
  .action-icon.palette:hover,
  .action-icon.move:hover,
  .action-icon.top:hover,
  .action-icon.bottom:hover,
  .action-icon.copy:hover {
    color: var(--accent-color);
    background: var(--accent-soft);
  }
  .action-icon.check:hover { color: var(--success-color); background: #f0fdf4; }
  .created-at-label { color: var(--text-faint); }
  body.action-menu-pinned .menu-toggle { color: var(--accent-color); background: var(--accent-soft); }

  #selection-bar {
    background: var(--accent-soft);
    border-color: #dbeafe;
    color: #1e40af;
  }
  .btn-primary { background: var(--accent-color); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { border-color: var(--border-color); color: var(--text-muted); }
  .btn-secondary:hover { background: var(--surface-hover); }

  footer {
    position: relative;
    min-height: 42px;
    padding: 6px 10px;
    background: rgba(250, 250, 249, .96);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .footer-left, .footer-right {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .footer-icon-btn {
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text-muted);
  }
  .footer-icon-btn svg { width: 16px; height: 16px; }
  .footer-icon-btn:hover {
    color: var(--text-color);
    background: var(--surface-hover);
    border-color: var(--border-color);
  }
  .footer-icon-btn:disabled { opacity: .35; cursor: default; background: transparent; border-color: transparent; }

  .save-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 64px;
    justify-content: flex-end;
    color: var(--text-muted);
    font-size: 11px;
    user-select: none;
  }
  .save-status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success-color);
    box-shadow: 0 0 0 2px rgba(22, 163, 74, .10);
  }
  .save-status[data-state="dirty"] .save-status-dot { background: var(--warning-color); box-shadow: 0 0 0 2px rgba(202,138,4,.10); }
  .save-status[data-state="saving"] .save-status-dot {
    background: var(--accent-color);
    box-shadow: 0 0 0 2px rgba(37,99,235,.10);
    animation: save-pulse 1s ease-in-out infinite;
  }
  .save-status[data-state="error"] { color: var(--danger-color); }
  .save-status[data-state="error"] .save-status-dot { background: var(--danger-color); box-shadow: 0 0 0 2px rgba(220,38,38,.10); }
  .save-status[data-state="feedback"] .save-status-dot { background: var(--accent-color); box-shadow: 0 0 0 2px rgba(37,99,235,.10); }
  @keyframes save-pulse { 50% { opacity: .35; transform: scale(.8); } }

  .footer-menu-wrapper { position: relative; }
  .footer-overflow-menu {
    position: absolute;
    right: 0;
    bottom: calc(100% + 8px);
    width: 236px;
    padding: 5px;
    border: 1px solid var(--border-color);
    border-radius: 9px;
    background: var(--surface);
    box-shadow: 0 10px 28px rgba(24,24,27,.14), 0 2px 8px rgba(24,24,27,.08);
    z-index: 200;
  }
  .footer-menu-item {
    width: 100%;
    min-height: 34px;
    padding: 7px 8px;
    display: grid;
    grid-template-columns: 18px 1fr auto;
    align-items: center;
    justify-content: initial;
    gap: 8px;
    border: 0;
    border-radius: 6px;
    color: var(--text-color);
    text-align: left;
    font-size: 12px;
  }
  .footer-menu-item svg { width: 16px; height: 16px; color: var(--text-muted); }
  .footer-menu-item:hover { background: var(--surface-hover); color: var(--text-color); }
  .footer-menu-item:hover svg { color: var(--accent-color); }
  .footer-menu-item.is-loading svg { animation: icon-spin .8s linear infinite; }
  @keyframes icon-spin { to { transform: rotate(360deg); } }
  .footer-menu-separator { height: 1px; background: var(--border-color); margin: 4px 6px; }
  .format-chip {
    padding: 1px 5px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text-faint);
    font-size: 9px;
    line-height: 1.4;
  }

  /* User-selected memo colors remain available, but are intentionally muted. */
  .editor-bg-red { background-color: #fff7f7 !important; }
  .editor-bg-blue { background-color: #f7faff !important; }
  .editor-bg-green { background-color: #f7fcf8 !important; }
  .editor-bg-yellow { background-color: #fffdf5 !important; }
  .editor-bg-purple { background-color: #fbf8ff !important; }
  .tab.tab-bg-red { background-color: #fce8e8; }
  .tab.tab-bg-blue { background-color: #e8f0fc; }
  .tab.tab-bg-green { background-color: #e8f6ec; }
  .tab.tab-bg-yellow { background-color: #f8f1d8; }
  .tab.tab-bg-purple { background-color: #f0e8f8; }

  /* --- 行番号・行ジャンプ --- */
  #editor {
    transition: padding-left .16s ease;
  }
  #editor.line-numbers-visible {
    padding-left: 44px;
  }
  .line-number {
    position: absolute;
    left: -30px;
    top: 5px;
    width: 23px;
    color: var(--text-faint);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    line-height: 18px;
    text-align: right;
    opacity: .52;
    pointer-events: none;
    user-select: none;
  }
  .row:hover .line-number {
    color: var(--text-muted);
    opacity: .8;
  }
  #btn-line-numbers.active {
    color: var(--accent-color);
    background: var(--accent-soft);
    border-color: #dbeafe;
  }
  .line-jump-indicator {
    position: absolute;
    top: 8px;
    right: 12px;
    z-index: 80;
    min-width: 38px;
    padding: 4px 8px;
    border: 1px solid #dbeafe;
    border-radius: 999px;
    background: rgba(255, 255, 255, .94);
    box-shadow: 0 4px 14px rgba(24, 24, 27, .08);
    color: var(--accent-color);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    text-align: center;
    pointer-events: none;
  }
  .row.line-jump-target {
    animation: line-jump-flash .85s ease-out;
  }
  @keyframes line-jump-flash {
    0% { background: #dbeafe; box-shadow: inset 3px 0 0 var(--accent-color); }
    100% { background: transparent; box-shadow: inset 0 0 0 transparent; }
  }

</style>
</head>
<body>

<header>
  <div id="status-bar">
    <div class="status-left">
      <span class="status-title">memo tool</span>
      <span id="instance-count" class="status-pill">起動中: 1つ</span>
    </div>

    <div class="status-right">
      <button id="btn-line-numbers" class="control-btn" title="行番号を非表示（アウトライナーのみ）" aria-label="行番号の表示切替" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 5h1v3M4 11h2l-2 3h2M4 17h2v3H4"/></svg>
      </button>
      <button id="btn-sort-stars" class="control-btn" title="★の数で降順ソート" aria-label="★の数で降順ソート">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 8.2l5-.7L12 3Z"/><path d="M19 14v7m0 0-3-3m3 3 3-3"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- タブバー領域 -->
<div id="tab-header-area">
  <!-- 左スクロールボタン -->
  <button id="tab-scroll-left" class="tab-scroll-btn" title="左へスクロール" aria-label="左へスクロール">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
  </button>

  <!-- タブリスト -->
  <div id="tab-list">
    <!-- JSでタブを生成 -->
  </div>

  <!-- 右スクロールボタン -->
  <button id="tab-scroll-right" class="tab-scroll-btn" title="右へスクロール" aria-label="右へスクロール">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
  </button>

  <!-- 新規作成ボタン (スクロールの外に配置) -->
  <div class="new-tab-wrapper">
    <button id="new-tab-btn" title="新規メモ作成" aria-label="新規メモ作成">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <!-- モード選択メニュー -->
    <div id="new-tab-menu" class="mode-menu">
      <div class="mode-menu-item" id="menu-outliner">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span>アウトライナー</span>
      </div>
      <div class="mode-menu-item" id="menu-text">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>テキスト</span>
      </div>
    </div>
  </div>
</div>

<!-- エディタエリア -->
<div id="editor-container">
  <div id="editor">
    <!-- JSでアイテム生成 -->
  </div>
</div>

<!-- 選択操作バー -->
<div id="selection-bar" class="hidden">
  <div style="display:flex; align-items:center; gap:8px;">
    <span id="selection-count" style="font-weight:bold;">0 items</span>
    <span style="font-size:11px;">selected</span>
  </div>
  <div class="btn-group">
    <button id="btn-selection-cancel" class="btn-secondary">Cancel</button>
    <button id="btn-selection-move" class="btn-primary">Move...</button>
  </div>
</div>

<!-- フッター -->
<footer>
  <div class="footer-left undo-redo">
    <button id="btn-undo" class="footer-icon-btn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M20 17a7 7 0 0 0-7-7H4"/></svg>
    </button>
    <button id="btn-redo" class="footer-icon-btn" title="やり直す (Ctrl+Shift+Z)" aria-label="やり直す">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5"/><path d="M4 17a7 7 0 0 1 7-7h9"/></svg>
    </button>
  </div>

  <div class="footer-right">
    <div id="save-status" class="save-status" data-state="saved" role="status" aria-live="polite">
      <span class="save-status-dot" aria-hidden="true"></span>
      <span id="save-status-text">保存済み</span>
    </div>

    <div class="footer-menu-wrapper">
      <button id="btn-footer-menu" class="footer-icon-btn" title="その他の操作" aria-label="その他の操作" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      </button>

      <div id="footer-menu" class="footer-overflow-menu hidden" role="menu">
        <button id="btn-force-reload" class="footer-menu-item" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          <span>最新データを再読み込み</span>
        </button>
        <button id="btn-copy-clipboard" class="footer-menu-item" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
          <span>クリップボードにコピー</span>
        </button>
        <div class="footer-menu-separator"></div>
        <button id="btn-download-txt" class="footer-menu-item" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 20h14"/></svg>
          <span>TXTで保存して閉じる</span><span class="format-chip">TXT</span>
        </button>
        <button id="btn-download-md" class="footer-menu-item" role="menuitem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 20h14"/></svg>
          <span>Markdownで保存して閉じる</span><span class="format-chip">MD</span>
        </button>
      </div>
    </div>
  </div>
</footer>

<script src="sidepanel.js"></script>
</body>
</html>
